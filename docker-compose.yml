services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: vault-risk-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vault_risk_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-vault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault_pass_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault_user} -d ${POSTGRES_DB:-vault_risk_copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vault-network

  # Database migration runner (runs once on startup)
  migrate:
    image: postgres:16-alpine
    container_name: vault-risk-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-vault_pass_local}@postgres:5432/${POSTGRES_DB:-vault_risk_copilot}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/run-migrations.sh:/tmp/run-migrations.sh:ro
    command: >
      sh -c "
        apk add --no-cache bash &&
        cp /tmp/run-migrations.sh /run-migrations.sh &&
        chmod +x /run-migrations.sh &&
        MIGRATIONS_DIR=/migrations /run-migrations.sh
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vault-network
    restart: "no"

  # Collector service (TypeScript)
  collector:
    build:
      context: ./packages/collector
      dockerfile: Dockerfile
      target: production
    container_name: vault-risk-collector
    environment:
      # Always use the compose network hostname. Do not inherit a host-only DATABASE_URL from .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-vault_pass_local}@postgres:5432/${POSTGRES_DB:-vault_risk_copilot}
      RPC_URL: ${RPC_URL:-}
      MAINNET_RPC_URL: ${MAINNET_RPC_URL:-https://eth.llamarpc.com}
      DEFILLAMA_API_URL: ${DEFILLAMA_API_URL:-https://yields.llama.fi}
      VAULT_ADDRESS: ${VAULT_ADDRESS:-}
      COLLECTION_INTERVAL_MS: ${COLLECTION_INTERVAL_MS:-300000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${NODE_ENV:-production}
      RISK_SERVICE_URL: http://risk-service:8000
      RISK_INTERNAL_TOKEN: ${RISK_INTERNAL_TOKEN:-local-dev-risk-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      risk-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vault-network

  # Risk service (Python FastAPI) — internal only; no host port by default.
  # Publish with: docker compose --profile debug up
  risk-service:
    build:
      context: ./packages/risk-service
      dockerfile: Dockerfile
    container_name: vault-risk-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-vault_pass_local}@postgres:5432/${POSTGRES_DB:-vault_risk_copilot}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RISK_INTERNAL_TOKEN: ${RISK_INTERNAL_TOKEN:-local-dev-risk-internal-token}
      RECOMPUTE_INTERVAL_SECONDS: ${RECOMPUTE_INTERVAL_SECONDS:-300}
      AUTO_RECOMPUTE_ON_STARTUP: ${AUTO_RECOMPUTE_ON_STARTUP:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vault-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Node.js API
  api:
    build:
      context: ./packages
      dockerfile: api/Dockerfile
    container_name: vault-risk-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-vault_pass_local}@postgres:5432/${POSTGRES_DB:-vault_risk_copilot}
      RISK_SERVICE_URL: http://risk-service:8000
      RISK_INTERNAL_TOKEN: ${RISK_INTERNAL_TOKEN:-local-dev-risk-internal-token}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      # Local-only 32-byte key (base64 of 32 ASCII 'A's). Generate your own for anything shared:
      #   openssl rand -base64 32
      LLM_KEY_ENCRYPTION_KEY: ${LLM_KEY_ENCRYPTION_KEY:-QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=}
      SIWE_DOMAIN: ${SIWE_DOMAIN:-localhost:5173}
      SIWE_URI: ${SIWE_URI:-http://localhost:5173}
      SIWE_CHAIN_ID: ${SIWE_CHAIN_ID:-31337}
      SIWE_CHAIN_IDS: ${SIWE_CHAIN_IDS:-31337,11155111}
      # Set to 'none' when the web app is on another site (GitHub Pages + tunnel).
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      risk-service:
        condition: service_healthy
    networks:
      - vault-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend (React + Vite)
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_CHAIN_ID: ${VITE_CHAIN_ID:-11155111}
        VITE_VAULT_ADDRESS: ${VAULT_ADDRESS:-}
        VITE_USDC_ADDRESS: ${MOCK_USDC_ADDRESS:-}
    container_name: vault-risk-web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - vault-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local

networks:
  vault-network:
    driver: bridge
