version: '3.9'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: vault-risk-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vault_risk_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-vault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault_pass_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault_user} -d ${POSTGRES_DB:-vault_risk_copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vault-network

  # Database migration runner (runs once on startup)
  migrate:
    image: postgres:16-alpine
    container_name: vault-risk-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-vault_pass_local}@postgres:5432/${POSTGRES_DB:-vault_risk_copilot}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/run-migrations.sh:/tmp/run-migrations.sh:ro
    command: >
      sh -c "
        apk add --no-cache bash &&
        cp /tmp/run-migrations.sh /run-migrations.sh &&
        chmod +x /run-migrations.sh &&
        MIGRATIONS_DIR=/migrations /run-migrations.sh
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vault-network
    restart: "no"

  # Collector service (TypeScript)
  collector:
    build:
      context: ./packages/collector
      dockerfile: Dockerfile
      target: production
    container_name: vault-risk-collector
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-vault_pass_local}@postgres:5432/${POSTGRES_DB:-vault_risk_copilot}}
      RPC_URL: ${RPC_URL:-}
      MAINNET_RPC_URL: ${MAINNET_RPC_URL:-https://eth.llamarpc.com}
      DEFILLAMA_API_URL: ${DEFILLAMA_API_URL:-https://yields.llama.fi}
      VAULT_ADDRESS: ${VAULT_ADDRESS:-}
      COLLECTION_INTERVAL_MS: ${COLLECTION_INTERVAL_MS:-300000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - vault-network

  # ============================================================================
  # FUTURE SERVICES (Phase 4-5) - Uncomment when implemented
  # ============================================================================

  # Risk service (Python FastAPI) - Phase 3 (ENABLED)
  risk-service:
    build:
      context: ./packages/risk-service
      dockerfile: Dockerfile
    container_name: vault-risk-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-vault_pass_local}@postgres:5432/${POSTGRES_DB:-vault_risk_copilot}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${RISK_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vault-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Node.js API - Phase 4
  api:
    build:
      context: ./packages
      dockerfile: api/Dockerfile
    container_name: vault-risk-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-vault_pass_local}@postgres:5432/${POSTGRES_DB:-vault_risk_copilot}
      RISK_SERVICE_URL: http://risk-service:8000
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_KEY_ENCRYPTION_KEY: ${LLM_KEY_ENCRYPTION_KEY:?LLM_KEY_ENCRYPTION_KEY required - run: export LLM_KEY_ENCRYPTION_KEY=$(openssl rand -base64 32)}
      SIWE_DOMAIN: ${SIWE_DOMAIN:-localhost}
      SIWE_URI: ${SIWE_URI:-http://localhost:3000}
      SIWE_CHAIN_ID: ${SIWE_CHAIN_ID:-1}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      risk-service:
        condition: service_healthy
    networks:
      - vault-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend (React + Vite) - Phase 4-5
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_CHAIN_ID: ${VITE_CHAIN_ID:-11155111}
        VITE_VAULT_ADDRESS: ${VAULT_ADDRESS:-}
        VITE_USDC_ADDRESS: ${MOCK_USDC_ADDRESS:-}
    container_name: vault-risk-web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks:
      - vault-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # # MCP server (TypeScript, read-only) - Phase 5
  # mcp:
  #   profiles: ["full"]
  #   build:
  #     context: ./packages/mcp
  #     dockerfile: Dockerfile
  #   container_name: vault-risk-mcp
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-vault_pass_local}@postgres:5432/${POSTGRES_DB:-vault_risk_copilot}
  #     API_URL: http://api:3000
  #     RPC_URL: ${RPC_URL}
  #     VAULT_ADDRESS: ${VAULT_ADDRESS}
  #     NODE_ENV: ${NODE_ENV:-development}
  #   ports:
  #     - "${MCP_PORT:-3001}:3001"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     api:
  #       condition: service_started
  #   networks:
  #     - vault-network

volumes:
  postgres_data:
    driver: local

networks:
  vault-network:
    driver: bridge
