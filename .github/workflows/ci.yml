name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      
      - name: Show Foundry version
        run: |
          forge --version
          cast --version
          anvil --version
      
      - name: Build contracts
        working-directory: contracts
        run: forge build --sizes
      
      - name: Run tests
        working-directory: contracts
        run: forge test -vvv
      
      - name: Run coverage
        working-directory: contracts
        run: forge coverage --report summary
      
      - name: Check gas snapshots
        working-directory: contracts
        run: forge snapshot --check

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      
      - name: Check Solidity formatting
        working-directory: contracts
        run: forge fmt --check

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Slither
        run: pip install slither-analyzer
      
      - name: Run Slither
        working-directory: contracts
        run: slither . --fail-none --json slither-report.json || true
      
      - name: Upload Slither report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: contracts/slither-report.json
      
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependency-check:
    name: Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      
      - name: Check for known vulnerabilities in dependencies
        working-directory: contracts
        run: |
          echo "Checking OpenZeppelin and forge-std for known issues..."
          forge update
          
          echo "Dependencies updated successfully"

  collector:
    name: Collector Service
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/collector/package-lock.json
      
      - name: Install dependencies
        working-directory: packages/collector
        run: npm ci
      
      - name: Lint
        working-directory: packages/collector
        run: npm run lint || echo "Linting will be configured later"
      
      - name: Type check
        working-directory: packages/collector
        run: npm run typecheck
      
      - name: Run tests
        working-directory: packages/collector
        run: npm test
      
      - name: Build
        working-directory: packages/collector
        run: npm run build

  risk-service:
    name: Risk Service (Python)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_risk
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: packages/risk-service/requirements-dev.txt
      
      - name: Install dependencies
        working-directory: packages/risk-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Set up database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d vault_risk -f db/migrations/001_initial_schema.sql
      
      - name: Lint with ruff
        working-directory: packages/risk-service
        run: |
          ruff check app/ tests/
          ruff format --check app/ tests/
      
      - name: Type check with mypy
        working-directory: packages/risk-service
        run: mypy app/
      
      - name: Run unit tests
        working-directory: packages/risk-service
        run: pytest -m unit --cov=app --cov-report=term-missing --cov-report=xml
      
      - name: Run integration tests
        working-directory: packages/risk-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vault_risk
        run: pytest -m integration -v
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./packages/risk-service/coverage.xml
          flags: risk-service
          name: risk-service-coverage

  api:
    name: API Service (Node.js)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_risk
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            packages/llm/package-lock.json
            packages/api/package-lock.json
      
      - name: Build llm package
        working-directory: packages/llm
        run: |
          npm ci
          npm run build
      
      - name: Set up database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d vault_risk -f db/migrations/001_initial_schema.sql
      
      - name: Install dependencies
        working-directory: packages/api
        run: npm ci
      
      - name: Type check
        working-directory: packages/api
        run: npm run typecheck
      
      - name: Run unit tests
        working-directory: packages/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vault_risk
        run: npm test
      
      - name: Build
        working-directory: packages/api
        run: npm run build

  llm:
    name: LLM Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/llm/package-lock.json
      
      - name: Install dependencies
        working-directory: packages/llm
        run: npm ci
      
      - name: Type check
        working-directory: packages/llm
        run: npm run typecheck
      
      - name: Run unit tests
        working-directory: packages/llm
        run: npm test
      
      - name: Build
        working-directory: packages/llm
        run: npm run build
      
      - name: Run evals
        working-directory: packages/llm
        run: npm run eval

  web:
    name: Web Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/web/package-lock.json
      
      - name: Install dependencies
        working-directory: packages/web
        run: npm ci
      
      - name: Lint
        working-directory: packages/web
        run: npm run lint
      
      - name: Type check
        working-directory: packages/web
        run: npm run typecheck
      
      - name: Run tests
        working-directory: packages/web
        run: npm test
      
      - name: Build
        working-directory: packages/web
        env:
          VITE_API_URL: http://localhost:3000
          VITE_CHAIN_ID: 31337
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build collector image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/collector
          push: false
          tags: vault-risk-collector:latest
          cache-from: type=gha,scope=collector
          cache-to: type=gha,scope=collector,mode=max
      
      - name: Build risk-service image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/risk-service
          push: false
          tags: vault-risk-service:latest
          cache-from: type=gha,scope=risk-service
          cache-to: type=gha,scope=risk-service,mode=max
      
      - name: Build api image
        uses: docker/build-push-action@v5
        with:
          context: ./packages
          file: ./packages/api/Dockerfile
          push: false
          tags: vault-risk-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      
      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: ./packages/web
          push: false
          tags: vault-risk-web:latest
          build-args: |
            VITE_API_URL=http://localhost:3000
            VITE_CHAIN_ID=31337
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  compose-smoke-test:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=vault_user
          POSTGRES_PASSWORD=vault_pass_ci
          POSTGRES_DB=vault_risk_copilot
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://vault_user:vault_pass_ci@postgres:5432/vault_risk_copilot
          RISK_SERVICE_URL=http://risk-service:8000
          DEFILLAMA_API_URL=https://yields.llama.fi
          COLLECTION_INTERVAL_MS=300000
          LOG_LEVEL=info
          NODE_ENV=production
          EOF
      
      - name: Start services
        run: docker compose up -d --build
      
      - name: Check migrate service logs
        if: always()
        run: |
          echo "=== Migrate service logs ==="
          docker compose logs migrate || echo "No migrate logs available"
      
      - name: Wait for postgres to be healthy
        run: |
          echo "Waiting for postgres to be healthy..."
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U vault_user; do sleep 2; done'
          echo "✅ Postgres is healthy"
      
      - name: Verify migrations applied
        run: |
          echo "Checking if tables exist..."
          docker compose exec -T postgres psql -U vault_user -d vault_risk_copilot -c "\dt" | grep pool_snapshots
          echo "✅ Migrations applied successfully"
      
      - name: Verify collector started
        run: |
          echo "Waiting for collector to start (up to 30 seconds)..."
          sleep 30
          
          if docker compose ps collector | grep -q "Up"; then
            echo "✅ Collector container is running"
          else
            echo "❌ Collector container failed to start"
            docker compose logs collector
            exit 1
          fi
          
          echo "Checking collector logs for startup confirmation..."
          if docker compose logs collector | grep -q "Vault Risk Collector starting"; then
            echo "✅ Collector started successfully"
          else
            echo "❌ Collector did not start properly"
            docker compose logs collector
            exit 1
          fi
      
      - name: Wait for collector to collect data
        id: wait_data
        run: |
          echo "Waiting for collector to insert data (up to 2 minutes)..."
          START_TIME=$(date +%s)
          TIMEOUT=120
          
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            if [ $ELAPSED -gt $TIMEOUT ]; then
              echo "❌ Timeout waiting for data collection after ${TIMEOUT}s"
              echo ""
              echo "=== Container status ==="
              docker compose ps -a
              echo ""
              echo "=== Collector inspect ==="
              docker inspect vault-risk-collector --format='{{json .State}}' | jq
              echo ""
              echo "=== All services logs (no tail) ==="
              docker compose logs --no-color
              exit 1
            fi
            
            COUNT=$(docker compose exec -T postgres psql -U vault_user -d vault_risk_copilot -t -c "SELECT COUNT(*) FROM pool_snapshots;" | tr -d ' ')
            
            echo "Current row count: $COUNT (elapsed: ${ELAPSED}s)"
            
            if [ "$COUNT" -gt 0 ] 2>/dev/null; then
              echo "✅ Data collection successful! Found $COUNT rows"
              echo "row_count=$COUNT" >> $GITHUB_OUTPUT
              break
            fi
            
            sleep 5
          done
      
      - name: Show collector logs on success
        if: success()
        run: |
          echo "=== Collector logs (last 30 lines) ==="
          docker compose logs collector --tail 30
      
      - name: Query sample data
        if: steps.wait_data.outcome == 'success'
        run: |
          echo "=== Sample collected data ==="
          docker compose exec -T postgres psql -U vault_user -d vault_risk_copilot -c "
            SELECT 
              protocol, 
              chain, 
              COUNT(*) as snapshots, 
              ROUND(AVG(tvl_usd)::numeric, 0) as avg_tvl,
              ROUND(AVG(apy)::numeric, 2) as avg_apy
            FROM pool_snapshots
            GROUP BY protocol, chain
            ORDER BY avg_tvl DESC
            LIMIT 10;
          "
      
      - name: Wait for risk-service to be healthy
        run: |
          echo "Waiting for risk-service to be healthy (up to 60 seconds)..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 2; done'
          echo "✅ Risk service is healthy"
      
      - name: Test risk-service API
        run: |
          echo "=== Testing /health endpoint ==="
          HEALTH=$(curl -s http://localhost:8000/health)
          echo "$HEALTH" | jq .
          
          STATUS=$(echo "$HEALTH" | jq -r '.status')
          if [ "$STATUS" != "healthy" ]; then
            echo "❌ Risk service status is not healthy: $STATUS"
            exit 1
          fi
          echo "✅ Risk service health check passed"
      
      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API to be healthy..."
          
          # Try to wait for API with timeout
          if timeout 60 bash -c 'until curl -sf http://localhost:3000/api/health > /dev/null; do sleep 2; done'; then
            echo "✅ API responded to health check"
          else
            echo "❌ Timeout or error waiting for API health check"
            echo ""
            echo "=== API container status ==="
            docker compose ps api
            echo ""
            echo "=== API logs ==="
            docker compose logs api
            exit 1
          fi
          
          echo "Checking API health response..."
          HEALTH_RESPONSE=$(curl -s http://localhost:3000/api/health | jq -r '.status')
          
          if [ "$HEALTH_RESPONSE" == "healthy" ] || [ "$HEALTH_RESPONSE" == "degraded" ]; then
            echo "✅ API is healthy (status: $HEALTH_RESPONSE)"
          else
            echo "❌ API health check failed (status: $HEALTH_RESPONSE)"
            echo ""
            echo "=== API logs ==="
            docker compose logs api
            exit 1
          fi
      
      - name: Test API endpoints
        run: |
          echo "=== Testing API /api/pools endpoint ==="
          POOLS_RESPONSE=$(curl -s http://localhost:3000/api/pools?limit=5)
          
          if echo "$POOLS_RESPONSE" | jq -e '.data' > /dev/null; then
            POOL_COUNT=$(echo "$POOLS_RESPONSE" | jq '.data | length')
            echo "✅ API returned $POOL_COUNT pools"
          else
            echo "❌ API /api/pools endpoint failed"
            echo "Response: $POOLS_RESPONSE"
            exit 1
          fi
      
      - name: Trigger risk score computation
        run: |
          echo "=== Triggering risk score recomputation ==="
          RECOMPUTE_RESULT=$(curl -s -X POST http://localhost:8000/recompute \
            -H "Content-Type: application/json" \
            -d '{"pool_ids": null, "force": true}')
          
          echo "$RECOMPUTE_RESULT" | jq .
          
          COMPUTED=$(echo "$RECOMPUTE_RESULT" | jq -r '.computed')
          echo "Computed risk scores for $COMPUTED pools"
          
          if [ "$COMPUTED" -eq 0 ]; then
            echo "❌ No risk scores were computed"
            exit 1
          fi
          echo "✅ Risk score computation succeeded"
          
          # Save first computed pool ID for explain test
          COMPUTED_POOL_ID=$(echo "$RECOMPUTE_RESULT" | jq -r '.pool_ids[0]')
          echo "COMPUTED_POOL_ID=$COMPUTED_POOL_ID" >> $GITHUB_ENV
      
      - name: Test LLM explain endpoint
        run: |
          echo "=== Testing LLM explain endpoint with mock provider ==="
          
          # Use pool ID from recompute result
          POOL_ID="${COMPUTED_POOL_ID}"
          
          if [ -z "$POOL_ID" ] || [ "$POOL_ID" == "null" ]; then
            echo "❌ No pool ID available for testing"
            exit 1
          fi
          
          echo "Testing explain endpoint for pool ID: $POOL_ID"
          
          # Call explain endpoint
          EXPLAIN_RESPONSE=$(curl -s -X POST http://localhost:3000/api/pools/$POOL_ID/explain)
          
          # Debug: show full response
          echo "Full explain response:"
          echo "$EXPLAIN_RESPONSE" | jq .
          
          # Check response structure
          if echo "$EXPLAIN_RESPONSE" | jq -e '.explanation' > /dev/null; then
            echo "✅ Explain endpoint returned valid response"
            echo "$EXPLAIN_RESPONSE" | jq '.explanation | {summary, factors_count: (.key_factors | length), has_disclaimer: (.disclaimer != null)}'
          else
            echo "❌ Explain endpoint failed or returned invalid response"
            echo "Response: $EXPLAIN_RESPONSE"
            exit 1
          fi
          
          # Verify explanation structure
          SUMMARY=$(echo "$EXPLAIN_RESPONSE" | jq -r '.explanation.summary')
          FACTORS_COUNT=$(echo "$EXPLAIN_RESPONSE" | jq '.explanation.key_factors | length')
          HAS_DISCLAIMER=$(echo "$EXPLAIN_RESPONSE" | jq -e '.explanation.disclaimer' > /dev/null && echo "yes" || echo "no")
          
          if [ -z "$SUMMARY" ] || [ "$SUMMARY" == "null" ]; then
            echo "❌ Explanation has no summary"
            exit 1
          fi
          
          if [ "$FACTORS_COUNT" -eq 0 ]; then
            echo "❌ Explanation has no key factors"
            exit 1
          fi
          
          if [ "$HAS_DISCLAIMER" == "no" ]; then
            echo "❌ Explanation has no disclaimer"
            exit 1
          fi
          
          echo "✅ LLM explain endpoint validated successfully"
      
      - name: Verify risk_scores table
        run: |
          echo "=== Checking risk_scores table ==="
          RISK_COUNT=$(docker compose exec -T postgres psql -U vault_user -d vault_risk_copilot -t -c "SELECT COUNT(*) FROM risk_scores;" | tr -d ' ')
          
          echo "Risk scores count: $RISK_COUNT"
          
          if [ "$RISK_COUNT" -eq 0 ]; then
            echo "❌ No risk scores found in database"
            exit 1
          fi
          echo "✅ Risk scores exist in database: $RISK_COUNT rows"
          
          echo "=== Sample risk scores ==="
          docker compose exec -T postgres psql -U vault_user -d vault_risk_copilot -c "
            SELECT 
              pool_id,
              ROUND(total_risk_score::numeric, 2) as risk_score,
              risk_category,
              is_anomaly
            FROM risk_scores
            ORDER BY total_risk_score DESC
            LIMIT 5;
          "
      
      - name: Test GET /scores endpoint
        run: |
          echo "=== Testing GET /scores endpoint ==="
          SCORES=$(curl -s "http://localhost:8000/scores?limit=5")
          echo "$SCORES" | jq .
          
          TOTAL=$(echo "$SCORES" | jq -r '.total')
          echo "Total scores returned: $TOTAL"
          
          if [ "$TOTAL" -eq 0 ]; then
            echo "❌ No scores returned from API"
            exit 1
          fi
          echo "✅ GET /scores endpoint works"
      
      - name: Cleanup
        if: always()
        run: docker compose down -v

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/web/package-lock.json
      
      - name: Install dependencies
        working-directory: packages/web
        run: npm ci
      
      - name: Start Postgres
        run: |
          docker run -d \
            --name postgres-e2e \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=vault_risk \
            -p 5432:5432 \
            postgres:16
          
          # Wait for Postgres to be ready (after initdb restart)
          # postgres:16 entrypoint starts temporary server for initdb, then restarts
          # Wait for 'database system is ready to accept connections' to appear twice
          timeout 60 bash -c 'until [ $(docker logs postgres-e2e 2>&1 | grep -c "database system is ready to accept connections") -ge 2 ]; do sleep 1; done'
          
          # Extra validation: ensure postgres accepts connections
          docker exec postgres-e2e psql -U postgres -c "SELECT 1" > /dev/null
          echo "✅ Postgres is ready"
      
      - name: Run database migrations
        run: |
          docker cp db/migrations postgres-e2e:/tmp/migrations
          docker cp db/run-migrations.sh postgres-e2e:/tmp/run-migrations.sh
          docker exec postgres-e2e bash -c "DATABASE_URL='postgresql://postgres:postgres@localhost:5432/vault_risk' MIGRATIONS_DIR=/tmp/migrations bash /tmp/run-migrations.sh"
      
      - name: Seed E2E test data
        run: |
          docker cp db/e2e-seed.sql postgres-e2e:/tmp/seed.sql
          docker exec postgres-e2e psql -U postgres -d vault_risk -f /tmp/seed.sql
      
      - name: Install Playwright browsers
        working-directory: packages/web
        run: npx playwright install --with-deps chromium
      
      - name: Build and start API service
        run: |
          cd packages/llm
          npm ci
          npm run build
          
          cd ../api
          npm ci
          npm run build
          
          # Start API in background with mock LLM provider
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/vault_risk \
          LLM_PROVIDER=mock \
          NODE_ENV=test \
          PORT=3000 \
          nohup node dist/index.js > /tmp/api.log 2>&1 &
          
          # Wait for API to be ready
          timeout 30 bash -c 'until curl -sf http://localhost:3000/api/health > /dev/null; do sleep 1; done'
          echo "✅ API is ready"
      
      - name: Run E2E tests
        working-directory: packages/web
        shell: bash
        env:
          VITE_API_URL: http://localhost:3000
        run: |
          export PATH="$PATH:$HOME/.foundry/bin"
          bash e2e/run-e2e.sh
      
      - name: Show API logs on failure
        if: failure()
        run: |
          echo "=== API Logs ==="
          cat /tmp/api.log || echo "No API logs found"
      
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: docs/screenshots/
          retention-days: 30
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 30
      
      - name: Upload Anvil logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anvil-logs
          path: packages/web/anvil.log
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Stop containers
        if: always()
        run: |
          docker stop postgres-e2e || true
          docker rm postgres-e2e || true
  
  # Test migration runner error handling
  migration-error-test:
    name: Migration Error Handling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_risk
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up schema_migrations table
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d vault_risk -c "
            CREATE TABLE IF NOT EXISTS schema_migrations (
              version INTEGER PRIMARY KEY,
              applied_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
              name VARCHAR(255) NOT NULL
            );
          "
      
      - name: Test broken migration fails correctly
        run: |
          # Copy broken migration to test directory
          mkdir -p /tmp/test-migrations
          cp db/migrations/999_test_broken.sql.disabled /tmp/test-migrations/999_test_broken.sql
          
          # This MUST fail (runner connects to service container via localhost:5433)
          if DATABASE_URL='postgresql://postgres:postgres@localhost:5433/vault_risk' MIGRATIONS_DIR=/tmp/test-migrations bash db/run-migrations.sh; then
            echo "ERROR: Broken migration should have failed but succeeded!"
            exit 1
          else
            echo "✓ Broken migration correctly failed"
          fi
          
          # Verify schema_migrations table doesn't have the broken entry
          COUNT=$(PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d vault_risk -tAc "SELECT COUNT(*) FROM schema_migrations WHERE version = 999")
          if [ "$COUNT" != "0" ]; then
            echo "ERROR: Broken migration was marked as applied!"
            exit 1
          fi
          echo "✓ Broken migration was not recorded"
      
      - name: Cleanup
        if: always()
        run: |
          docker stop postgres-migration-test || true
          docker rm postgres-migration-test || true
  
  migration-upgrade-path:
    name: Migration Upgrade Path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_risk
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Apply old migrations via initdb (simulating pre-PR volumes)
        run: |
          # Simulate old deployment: 001 and 002 applied, no schema_migrations table
          PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -d vault_risk -f db/migrations/001_initial_schema.sql
          PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -d vault_risk -f db/migrations/002_fix_explanation_cache_key.sql
          echo "✓ Old migrations applied (simulating pre-PR state)"
      
      - name: Verify baseline detection and migration runner
        run: |
          # Run migration runner - should detect baseline and record 001+002
          DATABASE_URL='postgresql://postgres:postgres@localhost:5434/vault_risk' MIGRATIONS_DIR=db/migrations bash db/run-migrations.sh
          
          # Verify 001 and 002 are recorded
          COUNT_001=$(PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -d vault_risk -tAc "SELECT COUNT(*) FROM schema_migrations WHERE version = 1")
          COUNT_002=$(PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -d vault_risk -tAc "SELECT COUNT(*) FROM schema_migrations WHERE version = 2")
          COUNT_003=$(PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -d vault_risk -tAc "SELECT COUNT(*) FROM schema_migrations WHERE version = 3")
          
          if [ "$COUNT_001" != "1" ] || [ "$COUNT_002" != "1" ]; then
            echo "ERROR: Baseline migrations not recorded correctly!"
            exit 1
          fi
          
          if [ "$COUNT_003" != "1" ]; then
            echo "ERROR: Migration 003 not applied!"
            exit 1
          fi
          
          echo "✓ Upgrade path works: baseline recorded, new migration applied"
  
  migration-partial-schema:
    name: Migration Partial Schema (001 only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_risk
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Apply only 001 (simulating partial deployment)
        run: |
          # Apply only migration 001, NOT 002 (partial schema)
          PGPASSWORD=postgres psql -h localhost -p 5435 -U postgres -d vault_risk -f db/migrations/001_initial_schema.sql
          echo "✓ Migration 001 applied (partial schema)"
      
      - name: Verify migration 002 actually executes
        run: |
          # Run migration runner - should detect 001 baseline, then EXECUTE 002
          DATABASE_URL='postgresql://postgres:postgres@localhost:5435/vault_risk' MIGRATIONS_DIR=db/migrations bash db/run-migrations.sh
          
          # Verify 001 is recorded as baseline
          COUNT_001=$(PGPASSWORD=postgres psql -h localhost -p 5435 -U postgres -d vault_risk -tAc "SELECT COUNT(*) FROM schema_migrations WHERE version = 1")
          
          # Verify 002 is recorded AND provider column exists
          COUNT_002=$(PGPASSWORD=postgres psql -h localhost -p 5435 -U postgres -d vault_risk -tAc "SELECT COUNT(*) FROM schema_migrations WHERE version = 2")
          PROVIDER_EXISTS=$(PGPASSWORD=postgres psql -h localhost -p 5435 -U postgres -d vault_risk -tAc "SELECT EXISTS (SELECT FROM information_schema.columns WHERE table_name = 'explanations' AND column_name = 'provider')")
          
          if [ "$COUNT_001" != "1" ]; then
            echo "ERROR: Migration 001 baseline not recorded!"
            exit 1
          fi
          
          if [ "$COUNT_002" != "1" ]; then
            echo "ERROR: Migration 002 not recorded!"
            exit 1
          fi
          
          if [ "$(echo $PROVIDER_EXISTS | tr -d '[:space:]')" != "t" ]; then
            echo "ERROR: provider column does not exist - migration 002 did not execute!"
            exit 1
          fi
          
          echo "✓ Partial schema test passed: 001 baseline, 002 executed with provider column"
  
  migration-only-pool-snapshots:
    name: Migration Only pool_snapshots Table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_risk
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create empty database (no tables - clean slate)
        run: |
          # Empty DB - 001 should create all tables (idempotent test)
          echo "✓ Database is empty - testing 001 creates all objects from scratch"
      
      - name: Verify migrations run successfully
        run: |
          # Run migration runner - 001 should execute (idempotent), 002 should execute
          DATABASE_URL='postgresql://postgres:postgres@localhost:5436/vault_risk' MIGRATIONS_DIR=db/migrations bash db/run-migrations.sh
          
          # Verify 001 and 002 are recorded
          COUNT_001=$(PGPASSWORD=postgres psql -h localhost -p 5436 -U postgres -d vault_risk -tAc "SELECT COUNT(*) FROM schema_migrations WHERE version = 1")
          COUNT_002=$(PGPASSWORD=postgres psql -h localhost -p 5436 -U postgres -d vault_risk -tAc "SELECT COUNT(*) FROM schema_migrations WHERE version = 2")
          
          # Verify all 001 objects exist (indexes, risk_scores, explanations tables)
          INDEX_EXISTS=$(PGPASSWORD=postgres psql -h localhost -p 5436 -U postgres -d vault_risk -tAc "SELECT EXISTS (SELECT FROM pg_indexes WHERE indexname = 'idx_pool_snapshots_pool_id')")
          RISK_SCORES_EXISTS=$(PGPASSWORD=postgres psql -h localhost -p 5436 -U postgres -d vault_risk -tAc "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name = 'risk_scores')")
          EXPLANATIONS_EXISTS=$(PGPASSWORD=postgres psql -h localhost -p 5436 -U postgres -d vault_risk -tAc "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name = 'explanations')")
          PROVIDER_EXISTS=$(PGPASSWORD=postgres psql -h localhost -p 5436 -U postgres -d vault_risk -tAc "SELECT EXISTS (SELECT FROM information_schema.columns WHERE table_name = 'explanations' AND column_name = 'provider')")
          
          if [ "$COUNT_001" != "1" ] || [ "$COUNT_002" != "1" ]; then
            echo "ERROR: Migrations not recorded!"
            exit 1
          fi
          
          if [ "$(echo $INDEX_EXISTS | tr -d '[:space:]')" != "t" ]; then
            echo "ERROR: 001 index missing!"
            exit 1
          fi
          
          if [ "$(echo $RISK_SCORES_EXISTS | tr -d '[:space:]')" != "t" ]; then
            echo "ERROR: risk_scores table missing!"
            exit 1
          fi
          
          if [ "$(echo $EXPLANATIONS_EXISTS | tr -d '[:space:]')" != "t" ]; then
            echo "ERROR: explanations table missing!"
            exit 1
          fi
          
          if [ "$(echo $PROVIDER_EXISTS | tr -d '[:space:]')" != "t" ]; then
            echo "ERROR: provider column missing - 002 did not execute!"
            exit 1
          fi
          
          echo "✓ Empty-DB test passed: 001 executed (created all objects), 002 executed"
  
  migration-transaction-check:
    name: Migration Transaction Control Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Test 1 - Reject COMMIT in middle of line
        run: |
          echo "CREATE TABLE a(i int); COMMIT;" > db/migrations/998_test_commit.sql
          
          # Should fail
          if DATABASE_URL='postgresql://fake/db' MIGRATIONS_DIR=db/migrations bash db/run-migrations.sh 2>&1 | grep -i "contains COMMIT"; then
            echo "✓ Test 1 passed: COMMIT; detected"
          else
            echo "✗ Test 1 failed: COMMIT; not detected"
            exit 1
          fi
          
          rm db/migrations/998_test_commit.sql
      
      - name: Test 2 - Reject lowercase commit
        run: |
          echo "SELECT 1; commit;" > db/migrations/998_test_commit_lower.sql
          
          # Should fail
          if DATABASE_URL='postgresql://fake/db' MIGRATIONS_DIR=db/migrations bash db/run-migrations.sh 2>&1 | grep -i "contains COMMIT"; then
            echo "✓ Test 2 passed: commit; detected (case insensitive)"
          else
            echo "✗ Test 2 failed: commit; not detected"
            exit 1
          fi
          
          rm db/migrations/998_test_commit_lower.sql
      
      - name: Test 3 - Allow END inside $$ blocks
        run: |
          echo 'DO $$' > db/migrations/998_test_plpgsql.sql
          echo 'BEGIN' >> db/migrations/998_test_plpgsql.sql
          echo '  CREATE TABLE test(i int);' >> db/migrations/998_test_plpgsql.sql
          echo 'END $$;' >> db/migrations/998_test_plpgsql.sql
          
          # Should succeed (no error about END)
          if DATABASE_URL='postgresql://fake/db' MIGRATIONS_DIR=db/migrations bash db/run-migrations.sh 2>&1 | grep -i "contains END"; then
            echo "✗ Test 3 failed: False positive on DO \$\$ ... END \$\$"
            exit 1
          else
            echo "✓ Test 3 passed: PL/pgSQL END inside \$\$ allowed"
          fi
          
          rm db/migrations/998_test_plpgsql.sql
      
      - name: Test 4 - Reject standalone END;
        run: |
          echo "CREATE TABLE a(i int); END;" > db/migrations/998_test_end.sql
          
          # Should fail
          if DATABASE_URL='postgresql://fake/db' MIGRATIONS_DIR=db/migrations bash db/run-migrations.sh 2>&1 | grep -i "contains END"; then
            echo "✓ Test 4 passed: END; detected"
          else
            echo "✗ Test 4 failed: END; not detected"
            exit 1
          fi
          
          rm db/migrations/998_test_end.sql
